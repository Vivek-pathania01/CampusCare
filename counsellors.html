<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Counsellors | CampusCare
    </title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="counsellors">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            C
          </span>
          CampusCare
        </a>
        <nav id="site-nav">
        </nav>
      </div>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">
            Counsellor directory
          </span>
          <h1>
            Find the right person to talk to
          </h1>
          <p>
            Browse registered CampusCare counsellors by name or area of support.
          </p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="filters">
            <input id="counsellor-search" type="search" placeholder="Search by counsellor name">
            <select id="specialisation-filter">
              <option value="">
                All specialisations
              </option>
            </select>
          </div>
          <div id="counsellor-grid" class="featured-grid">
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container copyright">
        CampusCare — CSE326 demonstration project.
      </div>
    </footer>
    <script src="js/main.js">
    </script>
  </body>
</html>
