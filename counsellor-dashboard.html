<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Counsellor Dashboard | CampusCare
    </title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="counsellor-dashboard">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            C
          </span>
          CampusCare
        </a>
        <nav id="site-nav">
        </nav>
      </div>
    </header>
    <main>
      <section class="dashboard-head">
        <div class="container">
          <span class="eyebrow">
            Counsellor dashboard
          </span>
          <h1>
            Welcome,
            <span id="counsellor-name">
            </span>
          </h1>
          <p id="counsellor-specialisation" class="subtle">
          </p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div id="counsellor-stats" class="stats counsellor-stats">
          </div>
          <h2>
            Appointment requests
          </h2>
          <div id="requests-list" class="requests">
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container copyright">
        CampusCare — CSE326 demonstration project.
      </div>
    </footer>
    <script src="js/main.js">
    </script>
  </body>
</html>
