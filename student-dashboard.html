<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Student Dashboard | CampusCare
    </title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="student-dashboard">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            C
          </span>
          CampusCare
        </a>
        <nav id="site-nav">
        </nav>
      </div>
    </header>
    <main>
      <section class="dashboard-head">
        <div class="container">
          <span class="eyebrow">
            Student dashboard
          </span>
          <h1>
            Hello,
            <span id="student-name">
            </span>
          </h1>
          <p id="student-email" class="subtle">
          </p>
          <a class="button small" href="book.html">
            Book an Appointment
          </a>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div id="student-stats" class="stats">
          </div>
          <h2>
            Appointment history
          </h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>
                    Counsellor
                  </th>
                  <th>
                    Date
                  </th>
                  <th>
                    Time
                  </th>
                  <th>
                    Category
                  </th>
                  <th>
                    Mode
                  </th>
                  <th>
                    Status
                  </th>
                  <th>
                    Action
                  </th>
                </tr>
              </thead>
              <tbody id="student-appointments">
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container copyright">
        CampusCare — CSE326 demonstration project.
      </div>
    </footer>
    <script src="js/main.js">
    </script>
  </body>
</html>
